[project]
name = "tpk"
version = "0.1.0"
description = "Timeplus knowledge graph toolkit"
authors = [
    { email = "gang@timeplus.io" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.121.0",
    "graphifyy[claude,openai]>=0.9.38",
    "mcp[cli]>=2.0.0",
    "timeplus-connect>=0.8.17",
    "typer>=0.27.1",
]

[project.scripts]
tpk = "tpk.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
