# Corpus configuration for the Timeplus knowledge graph.
#
# Per repo:
#   path        local checkout to scan
#   visibility  "internal" | "public"  (default visibility for source-derived nodes)
#   extraction  "code-only" (default; local tree-sitter AST, free, skips YAML/Markdown)
#               | "semantic" (graphify LLM extraction; also processes YAML/Markdown/docs;
#                 requires ANTHROPIC_API_KEY or OPENAI_API_KEY in the environment)
#   description short human-readable summary (surfaced to the agent as repo context)

[llm]
# Backend for semantic extraction: "claude" | "openai" | "auto".
# "auto" lets graphify pick from whichever API key is exported.
backend = "auto"

[repos.proton]
path = "/Users/gangtao/Code/timeplus/proton"
visibility = "internal"
description = "Core open-source streaming SQL engine (C++), the foundation of Timeplus"

[repos.proton-enterprise]
path = "/Users/gangtao/Code/timeplus/proton-enterprise"
visibility = "internal"
description = "Enterprise build of the core engine with proprietary extensions (C++)"

[repos.timeplus-enterprise]
path = "/Users/gangtao/Code/timeplus/timeplus-enterprise"
visibility = "internal"
extraction = "semantic"
description = "Enterprise release packaging: Dockerfiles, Makefiles, release/deployment scripts"

[repos.helm-charts]
path = "/Users/gangtao/Code/timeplus/helm-charts"
visibility = "internal"
extraction = "semantic"
description = "Kubernetes Helm charts for deploying Timeplus Enterprise"

[repos.timeplus-enterprise-deployment]
path = "/Users/gangtao/Code/timeplus/timeplus-enterprise-deployment"
visibility = "internal"
extraction = "semantic"
description = "Deployment configurations and environment definitions for Timeplus Enterprise installs"

[repos.terraform-provider-timeplus]
path = "/Users/gangtao/Code/timeplus/terraform-provider-timeplus"
visibility = "internal"
description = "Terraform provider for managing Timeplus resources as infrastructure-as-code (Go)"

[repos.byoc]
path = "/Users/gangtao/Code/timeplus/byoc"
visibility = "internal"
description = "Bring-Your-Own-Cloud deployment automation for running Timeplus in customer cloud accounts"

[repos.timeplus-cli]
path = "/Users/gangtao/Code/timeplus/timeplus-cli"
visibility = "internal"
description = "Command-line tool for installing and managing Timeplus Enterprise deployments (Go)"

[repos.docs]
path = "/Users/gangtao/Code/timeplus/docs"
visibility = "public"
extraction = "semantic"
description = "Public product documentation (Docusaurus site): concepts, SQL reference, deployment guides"
