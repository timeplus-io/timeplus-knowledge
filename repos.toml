# Corpus configuration for the Timeplus knowledge graph.
#
# Per repo — exactly one source:
#   github + ref  DEFAULT: "org/repo" fetched at a pinned tag/release (or
#                 branch/SHA) into the checkout cache (TPK_CHECKOUT_DIR,
#                 default ~/.tpk/checkouts; /opt/tpk/.checkouts in docker).
#                 Private repos need GITHUB_TOKEN in the environment.
#   path          local checkout (dev mode; indexes whatever is on disk)
#
#   visibility  "internal" | "public"  (default visibility for source-derived nodes)
#   extraction  "code-only" (default; local tree-sitter AST, free, skips YAML/Markdown)
#               | "semantic" (adds an LLM pass over YAML/Markdown/docs; code is still
#                 AST-parsed locally in both modes, so LLM cost scales with doc count
#                 only; requires ANTHROPIC_API_KEY or OPENAI_API_KEY / *_BASE_URL)
#   description short human-readable summary (surfaced to the agent as repo context)

[llm]
# Backend for semantic extraction: "claude" | "openai" | "auto".
# Pinned to "openai" (gpt-oss via the Bedrock gateway) — cheap/fast for bulk
# doc extraction. NOTE: leave this explicit, not "auto": both ANTHROPIC_API_KEY
# and OPENAI_API_KEY are exported (the chat agent runs Claude Opus through the
# gateway's /anthropic surface), so "auto" would be ambiguous. Switch to
# backend = "claude", model = "anthropic.claude-opus-4-8" to extract with Opus.
backend = "openai"
model = "openai.gpt-oss-120b"
# Per-chunk token budget for semantic extraction. Gateways (AWS Bedrock)
# reject oversized request bodies; 16000 stays under the limit.
token_budget = 16000

# --- Runtime settings ------------------------------------------------------
# Every key below is also settable via an environment variable, which WINS over
# the file value (precedence: env var > this file > built-in default). Secrets
# (TIMEPLUS_PASSWORD, ANTHROPIC_API_KEY, OPENAI_API_KEY, GITHUB_TOKEN) are
# env-only and never read from here. All keys are commented out (defaults shown);
# uncomment to override. See README "Configuration" for the full matrix.

[db]
# host         = "localhost"     # env: TIMEPLUS_HOST
# user         = "default"       # env: TIMEPLUS_USER
# backend      = "timeplusd"     # env: TPK_DB_BACKEND      ("timeplusd" | "proton")
# stream_prefix = ""             # env: TPK_STREAM_PREFIX   (namespaces all streams)
# wait_seconds = 60              # env: TPK_DB_WAIT_SECONDS (serve: DB connect retry budget)

[agent]
# provider         = ""          # env: TPK_AGENT_PROVIDER  ("anthropic" | "openai"; auto from API keys if unset)
# model            = ""          # env: TPK_AGENT_MODEL     (default: claude-sonnet-5 / gpt-5.2)
# reasoning_effort = ""          # env: TPK_AGENT_REASONING_EFFORT (e.g. "low"; OpenAI reasoning models)

[server]
# checkout_dir = "~/.tpk/checkouts"  # env: TPK_CHECKOUT_DIR (github checkout cache)
# session_ttl  = 86400               # env: TPK_SESSION_TTL  (login session lifetime, seconds)
# chat_audit   = true                # env: TPK_CHAT_AUDIT   (false/0 disables chat auditing)

[repos.proton-enterprise]
github = "timeplus-io/proton-enterprise"
ref = "v3.3.1"
visibility = "internal"
description = "Enterprise build of the core streaming SQL engine with proprietary extensions (C++)"

[repos.timeplus-enterprise]
github = "timeplus-io/timeplus-enterprise"
ref = "v3.3.1"
visibility = "internal"
extraction = "semantic"
description = "Enterprise release packaging: Dockerfiles, Makefiles, release/deployment scripts"

[repos.helm-charts]
github = "timeplus-io/helm-charts"
ref = "timeplus-enterprise-v13.0.6"
visibility = "internal"
extraction = "semantic"
description = "Kubernetes Helm charts for deploying Timeplus Enterprise"

[repos.docs]
github = "timeplus-io/docs"
ref = "main"
visibility = "public"
extraction = "semantic"
description = "Public product documentation (Docusaurus site): concepts, SQL reference, deployment guides"
