# Secrets for tpk (both deployment modes reference this one Secret, `tpk-secrets`).
#
# DO NOT commit real values. Copy this file, fill it in, and apply it — or
# better, create the Secret imperatively so nothing sensitive lands on disk:
#
#   kubectl create namespace timeplus-knowledge
#   kubectl -n timeplus-knowledge create secret generic tpk-secrets \
#     --from-literal=TIMEPLUS_PASSWORD='change-this-db-password' \
#     --from-literal=ANTHROPIC_API_KEY='' \
#     --from-literal=OPENAI_API_KEY='sk-...' \
#     --from-literal=GITHUB_TOKEN='ghp_...'
#
# The key names match the environment variables tpk reads, so the Deployments
# below map them straight in with `envFrom`/`secretKeyRef`.
#
# Required:  TIMEPLUS_PASSWORD  provisions the `tpk` DB user and locks `default`.
# Optional:  ANTHROPIC_API_KEY / OPENAI_API_KEY  semantic extraction + chat agent
#            GITHUB_TOKEN                          fetch private corpus repos
# Custom LLM gateways: add ANTHROPIC_BASE_URL / OPENAI_BASE_URL / *_MODEL here too.
apiVersion: v1
kind: Secret
metadata:
  name: tpk-secrets
  namespace: timeplus-knowledge
type: Opaque
stringData:
  TIMEPLUS_PASSWORD: "change-this-db-password"
  # Leave a key out entirely (rather than blank) if you don't use it.
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
  GITHUB_TOKEN: ""
