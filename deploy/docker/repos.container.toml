# Corpus configuration for the Timeplus knowledge graph.
#
# Per repo — exactly one source:
#   github + ref  DEFAULT: "org/repo" fetched at a pinned tag/release (or
#                 branch/SHA) into the checkout cache (TPK_CHECKOUT_DIR,
#                 default ~/.tpk/checkouts; /opt/tpk/.checkouts in docker).
#                 Private repos need GITHUB_TOKEN in the environment.
#   path          local checkout (dev mode; indexes whatever is on disk)
#
#   visibility  "internal" | "public"  (default visibility for source-derived nodes)
#   extraction  "code-only" (default; local tree-sitter AST, free, skips YAML/Markdown)
#               | "semantic" (graphify LLM extraction; also processes YAML/Markdown/docs;
#                 requires ANTHROPIC_API_KEY or OPENAI_API_KEY / *_BASE_URL)
#   description short human-readable summary (surfaced to the agent as repo context)

[llm]
# Backend for semantic extraction: "claude" | "openai" | "auto".
# "auto" lets graphify pick from whichever API key is exported.
backend = "auto"
# Per-chunk token budget for semantic extraction. Gateways (AWS Bedrock)
# reject oversized request bodies; 16000 stays under the limit.
token_budget = 16000

# --- Runtime settings ------------------------------------------------------
# Every key below is also settable via an environment variable, which WINS over
# the file value (precedence: env var > this file > built-in default). Secrets
# (TIMEPLUS_PASSWORD, ANTHROPIC_API_KEY, OPENAI_API_KEY, GITHUB_TOKEN) are
# env-only. In the docker images these are driven by compose env vars, so the
# keys are left commented here (defaults shown). See README "Configuration".

[db]
# host         = "localhost"     # env: TIMEPLUS_HOST      (DB+App image sets this to "db")
# user         = "default"       # env: TIMEPLUS_USER      (images set this to "tpk")
# database     = "tpk"           # env: TIMEPLUS_DATABASE  (all tpk streams live here)
# backend      = "timeplusd"     # env: TPK_DB_BACKEND     (all-in-one image bakes "proton")
# stream_prefix = ""             # env: TPK_STREAM_PREFIX
# wait_seconds = 60              # env: TPK_DB_WAIT_SECONDS

[agent]
# provider         = ""          # env: TPK_AGENT_PROVIDER
# model            = ""          # env: TPK_AGENT_MODEL
# reasoning_effort = ""          # env: TPK_AGENT_REASONING_EFFORT

[server]
# checkout_dir = "/opt/tpk/.checkouts"  # env: TPK_CHECKOUT_DIR
# session_ttl  = 86400                  # env: TPK_SESSION_TTL
# chat_audit   = true                   # env: TPK_CHAT_AUDIT
# daily_token_limit = 0                  # env: TPK_DAILY_TOKEN_LIMIT (non-admin per-user/day; 0 = unlimited)

[repos.proton-enterprise]
github = "timeplus-io/proton-enterprise"
ref = "v3.3.1"
visibility = "internal"
description = "Enterprise build of the core streaming SQL engine with proprietary extensions (C++)"

[repos.timeplus-enterprise]
github = "timeplus-io/timeplus-enterprise"
ref = "v3.3.1"
visibility = "internal"
extraction = "semantic"
description = "Enterprise release packaging: Dockerfiles, Makefiles, release/deployment scripts"

[repos.helm-charts]
github = "timeplus-io/helm-charts"
ref = "timeplus-enterprise-v13.0.6"
visibility = "internal"
extraction = "semantic"
description = "Kubernetes Helm charts for deploying Timeplus Enterprise"

[repos.docs]
github = "timeplus-io/docs"
ref = "main"
visibility = "public"
extraction = "semantic"
description = "Public product documentation (Docusaurus site): concepts, SQL reference, deployment guides"
