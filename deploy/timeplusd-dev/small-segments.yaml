# Dev-only override for local timeplusd/proton (do NOT use in production).
# Two dev conveniences:
#
# 1. Disable nativelog segment preallocation. By default each stream shard
#    PREallocates a 2GB segment, so a handful of streams costs many GB up
#    front and fills a laptop Docker VM fast. `preallocate: false` lets
#    segments grow as data is written instead. Measured across 8 streams:
#    default preallocation = 27GB; `preallocate: false` = 313MB. (Shrinking
#    segment_size is unnecessary once preallocation is off — it made no
#    additional difference — so only the preallocate flag is set here.)
#
# 2. Raise the disk-usage guard. Both servers refuse writes once the data
#    disk exceeds `max_local_disk_usage_ratio` (default 0.9). Dev laptops
#    routinely run >90% full, which otherwise makes the all-in-one image fail
#    to start (schema-bootstrap inserts get rejected). 0.98 gives dev headroom
#    while still refusing writes on a truly-full disk.
#
# Mount at /etc/{timeplusd,proton}-server/config.d/small-segments.yaml.
max_local_disk_usage_ratio: 0.98
data:
    datastore:
        log:
            preallocate: false
